<div class="analytics-container">
  <div class="header">
    <h2>Dashboard Statistici Sistem</h2>
    <p class="subtitle">Analiza detaliată a sentimentelor, categoriilor și performanței surselor RSS.</p>
  </div>

  <div class="charts-wrapper" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 24px; margin-bottom: 24px;">
    
    <div class="chart-card" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);">
      <h3 style="margin-top: 0; color: #0f172a;">Distribuție Sentimente</h3>
      <div class="canvas-container" style="height: 400px; position: relative;">
        <canvas baseChart
          [data]="sentimentData"
          [type]="sentimentType"
          [options]="sentimentOptions">
        </canvas>
      </div>
    </div>
    
    <div class="chart-card" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);">
      <h3 style="margin-top: 0; color: #0f172a;">Categorii Articole</h3>
      <div class="canvas-container" style="height: 500px; position: relative;"> 
        <canvas baseChart
          [data]="categoryData"
          [type]="categoryType"
          [options]="categoryOptions">
        </canvas>
      </div>
    </div>

  </div>
  <div class="chart-card">
    <h3>Top 5 Surse de Știri</h3>
    <div class="canvas-container" style="height: 350px;">
      <canvas baseChart
        [data]="sourcesData"
        [options]="sourcesOptions"
        [type]="sourcesType">
      </canvas>
    </div>
  </div>
</div>
