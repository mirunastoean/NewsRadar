<div class="app-layout">
  <mat-toolbar color="primary" class="top-toolbar">
    <div style="display: flex; align-items: center;">
      <button mat-icon-button (click)="sidenav.toggle()" style="color: grey; margin-right: 15px;">
        <mat-icon>menu</mat-icon>
      </button>
      <span>{{ title }}</span>
    </div>
    <span class="spacer" style="flex: 1 1 auto;"></span>
    <button mat-flat-button color="accent" (click)="login()" *ngIf="!isLoggedIn">
      <mat-icon>login</mat-icon>
      Login
    </button>
    <button mat-flat-button color="warn" (click)="logout()" *ngIf="isLoggedIn">
      <mat-icon>logout</mat-icon>
      Logout ({{ userName }})
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="over" class="sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="/" (click)="sidenav.close()">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Știri</span>
        </a>
        <a mat-list-item routerLink="/sources" (click)="sidenav.close()">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Surse RSS</span>
        </a>
        <a mat-list-item routerLink="/status" routerLinkActive="active-link">
          <mat-icon matListItemIcon>monitor_heart</mat-icon>
          <span matListItemTitle>Status Sistem</span>
        </a>
        <a mat-list-item routerLink="/analytics" routerLinkActive="active-link">
          <mat-icon matListItemIcon>insert_chart</mat-icon>
          <div matListItemTitle>Statistici</div>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
