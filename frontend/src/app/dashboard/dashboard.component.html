<div class="search-section">
  <mat-card class="search-card">
    <mat-form-field appearance="fill" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input matInput type="text" placeholder="Caută titluri, surse, etc..." 
             [(ngModel)]="searchTerm" 
             (keyup)="onSearchChange()">
      <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </mat-card>
</div>

<div class="articles-container">
  @for (article of articles; track article.id) {
    <mat-card class="article-card">
      <mat-card-header>
        <mat-card-title>{{ article.title }}</mat-card-title>
        <mat-card-subtitle>{{ article.source }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="text-sm text-gray-600">
          {{ article.summary || (article.content | slice:0:120) + '...' || 'Fără descriere disponibilă.' }}
        </p>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button color="accent" [href]="article.url" target="_blank">Citește articolul</a>
      </mat-card-actions>
    </mat-card>
  } @empty {
    <div class="empty-state">
      <mat-icon>search_off</mat-icon>
      <p>Nu am găsit nicio știre care să corespundă căutării.</p>
    </div>
  }
</div>
