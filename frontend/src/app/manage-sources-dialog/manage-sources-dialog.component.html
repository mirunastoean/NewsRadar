<div class="manage-sources-container">
  <div class="header-actions">
    <div>
      <h2>Gestionează Sursele de Știri</h2>
      <p class="subtitle">Adaugă sau șterge fluxurile RSS pe care le urmărește sistemul.</p>
    </div>
    <button mat-flat-button class="add-btn" (click)="openAddSourceDialog()">
      <mat-icon>add</mat-icon>
      Adaugă Sursă
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nume Sursă </th>
        <td mat-cell *matCellDef="let element"> <strong>{{element.name}}</strong> </td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef> Link RSS </th>
        <td mat-cell *matCellDef="let element" class="url-text"> {{element.url}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Acțiuni </th>
        <td mat-cell *matCellDef="let element" class="actions-cell">
          <button mat-icon-button class="delete-btn" (click)="deleteSource(element)">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="modern-row"></tr>
    </table>
  </div>
</div>
